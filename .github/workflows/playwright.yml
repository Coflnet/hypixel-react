name: Cypress Tests
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
jobs:
  cypress-run:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      TEST_RUNNER: "true"
      NEXT_PUBLIC_TEST_RUNNER: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A pull request checks out a merge commit, its first parent is the base the PR is compared to.
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use the declared npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci
      - name: build app
        run: npm run build
      - name: Find the commit to compare changed specs against
        id: burn-in
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "base=HEAD^1" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          fi
      - name: Cypress (changed specs three times, the suite once)
        uses: cypress-io/github-action@v7
        env:
          BURN_IN_BASE: ${{ steps.burn-in.outputs.base }}
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
          command: npm run cypress:verify
      - name: Upload Cypress diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-results
          path: test-results/cypress
          if-no-files-found: ignore
          retention-days: 14
